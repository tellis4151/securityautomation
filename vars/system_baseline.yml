---
managed_system_files:
  - dest: /etc/motd
    owner: root
    group: root
    mode: "0644"
    content: |
      ===================================================================
       MANAGED SYSTEM - STANDARD RHEL 9 CONFIGURATION
       Unauthorized changes to system files are monitored and reverted.
      ===================================================================

  - dest: /etc/profile.d/99-org-environment.sh
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible Automation Platform
      umask 027
      readonly TMOUT=900
      export TMOUT

  - dest: /etc/ssh/sshd_config.d/10-org-standard.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
    content: |
      # Managed by Ansible Automation Platform
      MaxAuthTries 4
      ClientAliveInterval 300
      ClientAliveCountMax 2
      PermitEmptyPasswords no

  - dest: /etc/sysctl.d/99-org-standard.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible Automation Platform
      net.ipv4.ip_forward = 0
      net.ipv4.conf.all.accept_redirects = 0
      kernel.randomize_va_space = 2
